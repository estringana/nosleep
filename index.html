<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoSleep Gym Timer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <div class="timer-grid">
          <button
            class="main-ring"
            id="main-ring"
            type="button"
            aria-label="Start or pause timer"
          >
            <span class="ring-status" id="ring-status">Listo</span>
            <span class="ring-time" id="total-time">00:00:00</span>
            <span class="ring-caption">Tiempo total</span>
          </button>

          <aside class="side-panel">
            <div class="stat-card current-lap-card">
              <p class="label">Vuelta actual</p>
              <p class="value" id="lap-time">00:00</p>
              <p class="hint">Ideal para medir descansos entre series.</p>
              <button class="control lap-control" id="lap-button" type="button" disabled>
                Marcar vuelta
              </button>
            </div>

            <div class="stat-card laps-panel">
              <div class="laps-panel-header">
                <p class="label">Historial de vueltas</p>
                <p class="laps-summary" id="laps-summary">0 vueltas</p>
              </div>

              <div class="laps-list" id="laps-list" aria-live="polite">
                <div class="empty-state" id="empty-state">
                  Marca una vuelta al terminar cada serie para guardar el descanso.
                </div>
              </div>
            </div>
          </aside>
        </div>

        <div class="controls">
          <button class="control primary" id="start-pause" type="button">
            Empezar
          </button>
          <button class="control ghost" id="reset-button" type="button">
            Reset
          </button>
        </div>

        <section class="duration-card" aria-labelledby="duration-title">
          <div>
            <p class="label" id="duration-title">Límite de sesión</p>
            <p class="duration-description">
              El cronómetro se pausará y la pantalla podrá bloquearse al terminar.
            </p>
          </div>
          <label class="duration-input" for="duration-minutes">
            <span>Minutos</span>
            <input id="duration-minutes" type="text" inputmode="numeric" autocomplete="off" placeholder="Sin límite" />
          </label>
          <button class="control" id="apply-duration" type="button">Aplicar límite</button>
          <p class="duration-status" id="duration-status">Sin límite de tiempo</p>
        </section>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
